# Fly.io deployment (persistent VM: WebSockets + a volume for room snapshots).
# 1) fly launch --no-deploy --copy-config   2) fly volumes create rooms --size 1   3) fly deploy
app = "three-kingdoms-table"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data/rooms"

[[mounts]]
  source = "rooms"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"
